<button type="button" class="portal-article" data-action="read-article" data-id="{{id}}">
  <span class="portal-article-icon">{{icon:book}}</span>
  <span class="portal-article-text">
    <span class="portal-article-head"><strong>{{title}}</strong><span class="portal-article-category">{{category}}</span></span>
    <span class="portal-article-excerpt">{{excerpt}}</span>
  </span>
  <span class="portal-article-go" aria-hidden="true">{{icon:arrow}}</span>
</button>
