<div class="page-heading inbox-heading"><h1>กล่องข้อความ</h1></div>
<section class="card inbox-layout{{#hasDetail}} show-detail{{/hasDetail}}">
  <div class="inbox-list">
    <div class="inbox-tools">
      {{{search}}}
      <div class="inbox-filter-row">
        <div class="inbox-tabs" role="group" aria-label="แสดงบทสนทนา">{{{tabs}}}</div>
        {{{channelFilter}}}
      </div>
    </div>
    <div id="inbox-items">{{{items}}}</div>
  </div>
  <div class="inbox-detail" data-thread-scope>{{{detail}}}</div>
</section>
