<div class="combo" data-combobox="{{id}}">
  <div class="combo-control">
    {{icon:search}}
    <input id="{{id}}" class="combo-input" data-combo-input="1" role="combobox" aria-expanded="false" aria-controls="{{id}}-list" aria-autocomplete="list" autocomplete="off" {{#required}}required{{/required}} placeholder="{{placeholder}}" value="{{label}}">
    {{icon:down}}
  </div>
  <input type="hidden" name="{{name}}" value="{{value}}" data-combo-value>
  <ul class="combo-list" id="{{id}}-list" role="listbox" aria-label="รายการตัวเลือก" hidden></ul>
</div>
