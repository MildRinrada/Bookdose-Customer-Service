<div class="filters ticket-toolbar" data-filter-bar {{#selectedCount}}hidden{{/selectedCount}}>
  <div class="filter-chips" role="group" aria-label="ตัวกรองด่วน">{{{scopePills}}}</div>
  {{#contactName}}<a class="filter-pill active contact-chip" href="#tickets" aria-current="true" title="ล้างตัวกรองลูกค้า">ลูกค้า: {{contactName}} ✕</a>{{/contactName}}
  {{#filtered}}<a class="btn subtle" href="#tickets">ล้างตัวกรองทั้งหมด</a>{{/filtered}}
  <div class="display-options">
    <span id="ticket-count">{{count}} เคส</span>
    <label>ระยะห่างแถว <select data-density aria-label="ระยะห่างแถว">{{{densityOptions}}}</select></label>
  </div>
</div>
<div class="filters bulk-bar" data-bulk-bar role="toolbar" aria-label="จัดการเคสที่เลือก" {{^selectedCount}}hidden{{/selectedCount}}>
  <strong data-selection-count>เลือก {{selectedCount}} เคส</strong>
  <select class="quick-select" data-bulk-assign aria-label="เปลี่ยนผู้รับผิดชอบพร้อมกัน">{{{bulkAssignOptions}}}</select>
  <button type="button" class="btn sm" data-action="bulk-close">{{icon:checkCircle}}ปิดเคสพร้อมกัน</button>
  <button type="button" class="btn sm" data-action="export-selected">{{icon:download}}ส่งออกเคสที่เลือก</button>
  <button type="button" class="btn subtle" data-action="clear-selection">ยกเลิกการเลือก</button>
</div>
