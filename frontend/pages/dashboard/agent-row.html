<div class="agent-row" role="row">
  <span class="agent-who" role="cell">{{{avatar}}}<span class="presence-dot {{presence}}" aria-hidden="true"></span><span class="agent-name"><strong class="truncate">{{name}}</strong><span class="tiny muted truncate">{{role}} · {{team}}</span></span></span>
  <span class="agent-state" role="cell"><span class="presence-label {{presence}}">{{presenceLabel}}</span><span class="tiny muted">{{seen}}</span></span>
  <span class="mono agent-num" role="cell" data-label="เคสที่ถืออยู่">{{open}}</span>
  <span class="mono agent-num" role="cell" data-label="ปิดวันนี้">{{resolved}}</span>
  <span class="mono agent-num" role="cell" data-label="ตอบวันนี้">{{replies}}</span>
  <span class="mono agent-num" role="cell" data-label="ตอบครั้งแรกเฉลี่ย">{{speed}}</span>
  <span class="mono agent-num" role="cell" data-label="CSAT">{{csat}}</span>
</div>
