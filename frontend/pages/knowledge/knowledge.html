<div class="page-heading">
  <div><h1>คลังความรู้</h1><p>คู่มือที่ทีมใช้ตอบคำถามและช่วยเหลือลูกค้า</p></div>
  <div class="flex">{{#canWrite}}<button class="btn primary" data-action="new-article">{{icon:plus}}เขียนบทความใหม่</button>{{/canWrite}}</div>
</div>
<section class="filters knowledge-filters">
  {{{search}}}{{{visibilityFilter}}}{{{sortFilter}}}<span class="muted article-count" role="status">{{count}} บทความ</span>
</section>
<div class="filter-pills knowledge-tags" role="group" aria-label="หมวดหมู่บทความ">{{{categoryPills}}}</div>
<div class="article-grid" id="articles-grid">{{{cards}}}</div>
<div id="articles-pager">{{{pager}}}</div>
