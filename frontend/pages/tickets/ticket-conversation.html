<section class="card" data-thread-scope>
  <div class="card-header conv-card-header">
    <div class="flex">{{{channelBadge}}}<h2>บทสนทนากับ {{contactName}}</h2></div>
    <a class="btn sm" href="#inbox/{{id}}" title="เปิดบทสนทนานี้ในกล่องข้อความ">{{icon:inbox}}เปิดในกล่องข้อความ</a>
  </div>
  <div class="thread-filter" role="group" aria-label="แสดงข้อความ">{{{threadFilter}}}</div>
  <div class="thread" data-thread="{{id}}">{{{messages}}}</div>
  {{{composer}}}
</section>
