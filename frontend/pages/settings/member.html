<form data-form="member" data-id="{{id}}">
  {{#existing}}<p>{{name}} · {{email}}</p>{{/existing}}
  {{^existing}}
    <div class="notice">สร้างบัญชีให้สมาชิกใหม่ แล้วแจ้งอีเมลและรหัสผ่านให้เจ้าตัวโดยตรง ระบบรุ่นนี้ไม่ส่งอีเมลเชิญ</div>
    <div class="stack mb">{{{nameField}}}{{{emailField}}}{{{passwordField}}}</div>
  {{/existing}}
  <div class="form-grid">
    <div class="field"><label for="member-role">บทบาท</label><select id="member-role" name="role">{{{roleOptions}}}</select></div>
    <div class="field"><label for="member-team">ทีม</label><select id="member-team" name="team_id">{{{teamOptions}}}</select></div>
    {{#existing}}<label class="check span-2"><input name="active" type="checkbox" {{#active}}checked{{/active}}>อนุญาตให้เข้าใช้งานองค์กร</label>{{/existing}}
  </div>
  {{{formActions}}}
</form>
