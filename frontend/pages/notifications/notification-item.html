<a class="note-item note-{{tone}}" href="{{href}}" data-action="open-notification">
  <span class="note-icon">{{{icon}}}</span>
  <span class="note-body">
    <strong>{{title}}</strong>
    <span class="note-detail">{{detail}}</span>
  </span>
  <time class="note-time" datetime="{{iso}}" title="{{full}}">{{ago}}</time>
</a>
