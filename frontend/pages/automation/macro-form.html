<form data-form="macro" data-id="{{id}}" class="stack">
  {{{nameField}}}
  <div class="field">
    <label for="macro-reply">ข้อความแม่แบบที่ส่งหาลูกค้า</label>
    <textarea id="macro-reply" name="reply" maxlength="5000" rows="5" placeholder="เช่น รบกวนคุณ{customer} ส่งภาพหน้าจอเพิ่มเติมสำหรับเคส {case} ค่ะ">{{reply}}</textarea>
    <span class="tiny muted">เว้นว่างถ้าไม่ต้องส่งข้อความ · {customer} ชื่อลูกค้า · {case} เลขเคส · {agent} ชื่อผู้กดปุ่ม</span>
  </div>
  <div class="form-grid">
    <div class="field"><label for="macro-status">เปลี่ยนสถานะเคสเป็น</label><select id="macro-status" name="set_status">{{{statusOptions}}}</select></div>
    <div class="field"><label for="macro-followup">ตั้งเตือนติดตามผลอีก (ชั่วโมง)</label><input id="macro-followup" name="followup_hours" type="number" min="0" max="720" step="0.5" value="{{followupHours}}"><span class="tiny muted">0 = ไม่ตั้งเตือน · 24 = พรุ่งนี้เวลาเดิม</span></div>
  </div>
  {{{formActions}}}
</form>
