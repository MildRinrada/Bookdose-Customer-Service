<button type="button" class="macro-item" data-action="run-macro" data-id="{{id}}" data-kind="{{kind}}" data-target="{{target}}">
  <span class="macro-glyph">{{icon:macro}}</span>
  <span class="grow"><strong>{{name}}</strong><span class="macro-steps">{{steps}}</span>{{#preview}}<span class="auto-preview">“{{preview}}”</span>{{/preview}}</span>
</button>
