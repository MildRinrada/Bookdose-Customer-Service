<article class="message {{kind}}" data-message-id="{{id}}">
  {{{avatar}}}
  <div class="grow">
    <div class="message-header"><strong>{{author}}</strong>{{#isNote}}<span class="message-tag note-tag">{{icon:lock}}บันทึกภายใน</span>{{/isNote}}{{#isAI}}<span class="message-tag">{{icon:sparkle}}AI Chatbot</span>{{/isAI}}<time datetime="{{iso}}" title="{{fullTime}}">{{time}}</time></div>
    <div class="bubble{{#rich}} rich{{/rich}}">{{#rich}}{{{bodyHTML}}}{{/rich}}{{^rich}}{{body}}{{/rich}}{{#files}}<div class="message-files">{{{files}}}</div>{{/files}}</div>
    {{{citations}}}{{{delivery}}}
  </div>
</article>
