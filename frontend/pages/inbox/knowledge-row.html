<article class="kb-row">
  <div class="grow">
    <div class="kb-title"><strong>{{title}}</strong><span class="badge article-category">{{category}}</span>{{#isPublic}}<span class="badge resolved">เผยแพร่ให้ลูกค้า</span>{{/isPublic}}{{^isPublic}}<span class="badge closed">ภายในองค์กร</span>{{/isPublic}}</div>
    <p class="kb-excerpt">{{excerpt}}</p>
  </div>
  <div class="kb-actions">
    {{#canSend}}<button type="button" class="btn sm primary" data-action="kb-send-link" data-id="{{id}}">{{icon:send}}ส่งลิงก์ให้ลูกค้า</button>{{/canSend}}
    <button type="button" class="btn sm" data-action="kb-insert" data-id="{{id}}">{{icon:file}}แทรกเนื้อหา</button>
    <button type="button" class="btn sm subtle" data-action="read-article" data-id="{{id}}">อ่าน</button>
  </div>
</article>
