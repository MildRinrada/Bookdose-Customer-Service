<div class="card-body member-filters">
  {{{search}}}
  <div class="filter-pills" role="group" aria-label="บทบาท">{{{pills}}}</div>
  <span class="muted article-count" role="status">{{count}} จาก {{total}} คน</span>
</div>
{{#count}}
  <div class="table-scroll">
    <table>
      <thead><tr><th>สมาชิก</th><th>อีเมล</th><th>บทบาท</th><th>ทีม</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
      <tbody>{{{rows}}}</tbody>
    </table>
  </div>
  <div class="card-body">{{{pager}}}</div>
{{/count}}
{{^count}}<div class="card-body">{{{empty}}}</div>{{/count}}
