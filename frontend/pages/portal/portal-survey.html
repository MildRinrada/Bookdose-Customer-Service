{{#pending}}<div class="portal-survey" role="group" aria-labelledby="portal-survey-title">
  <strong id="portal-survey-title">ทีมงานดูแลเรื่องนี้เป็นอย่างไรบ้าง?</strong>
  <p class="small muted">แตะดาวเพื่อให้คะแนน 1-5 คะแนนช่วยให้ทีมดูแลคุณได้ดีขึ้น</p>
  <div class="star-row">{{{stars}}}</div>
</div>{{/pending}}
{{#rating}}<div class="portal-survey done"><span class="csat-stars" aria-hidden="true">{{starText}}</span><span>ขอบคุณสำหรับคะแนน {{rating}}/5 ค่ะ</span></div>{{/rating}}
