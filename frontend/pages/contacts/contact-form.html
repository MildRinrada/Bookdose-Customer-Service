<form data-form="contact" data-id="{{id}}">
  <div class="form-grid">
    <div class="form-grid">{{{firstNameField}}}{{{lastNameField}}}</div>
    {{{emailField}}}{{{phoneField}}}{{{companyField}}}
    <p class="notice warning span-2" data-duplicate-warning role="status" hidden></p>
    <div class="field span-2"><label for="contact-notes">หมายเหตุ</label><textarea id="contact-notes" name="notes" maxlength="3000" placeholder="ข้อมูลเพิ่มเติมที่ช่วยในการดูแลลูกค้า">{{notes}}</textarea></div>
  </div>
  <p class="small muted">ชื่อและนามสกุลเดิมยังคงอยู่ หากเป็นข้อมูลเก่า สามารถจัดแยกช่องได้โดยไม่สูญหาย</p>
  {{{formActions}}}
</form>
