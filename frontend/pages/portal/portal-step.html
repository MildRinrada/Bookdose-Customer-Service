<li class="portal-progress-step{{#done}} done{{/done}}{{#current}} current{{/current}}"{{#current}} aria-current="step"{{/current}}>
  <span class="portal-progress-dot" aria-hidden="true">{{#done}}{{icon:check}}{{/done}}{{^done}}{{number}}{{/done}}</span>
  <span class="portal-progress-label">{{label}}</span>
</li>
