<div class="table-scroll density-{{density}}{{#compact}} dashboard-table{{/compact}}{{^compact}} ticket-list{{/compact}}">
  <table>
    {{#compact}}<colgroup><col class="col-subject"><col class="col-customer"><col class="col-status"><col class="col-priority"><col class="col-actions"></colgroup>{{/compact}}
    {{^compact}}<colgroup>{{#selectable}}<col class="col-check">{{/selectable}}<col class="col-subject"><col class="col-customer"><col class="col-status"><col class="col-priority"><col class="col-assignee"><col class="col-updated"></colgroup>{{/compact}}
    <thead>
      <tr>
        {{#selectable}}<th><input type="checkbox" data-select-all aria-label="เลือกเคสที่แสดงทั้งหมด"></th>{{/selectable}}
        <th>เรื่อง / หมายเลขเคส</th><th class="customer-col">ลูกค้า</th><th>สถานะ</th><th>ความเร่งด่วน</th>
        {{#compact}}<th><span class="sr-only">จัดการเคส</span></th>{{/compact}}
        {{^compact}}<th>ผู้รับผิดชอบ</th><th>อัปเดต / SLA</th>{{/compact}}
      </tr>
    </thead>
    <tbody>{{{rows}}}</tbody>
  </table>
</div>
{{{pager}}}
