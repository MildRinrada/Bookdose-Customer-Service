<div class="photo-picker">
  <button type="button" class="photo-button" data-action="pick-photo" aria-label="เปลี่ยนรูปโปรไฟล์" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">
    <span class="photo-frame" data-photo-preview>{{{photo}}}</span>
    <span class="photo-camera" aria-hidden="true">{{icon:camera}}</span>
  </button>
  <div class="photo-side">
    <strong>รูปโปรไฟล์</strong>
    <p class="photo-hint muted">คลิกที่รูปเพื่อเลือกภาพใหม่ แล้วเลื่อนและย่อ-ขยายให้พอดีวงกลม · PNG หรือ JPG ไม่เกิน 5 MB</p>
    <div class="photo-actions">
      <button type="button" class="btn sm" data-action="pick-photo">{{icon:image}}เลือกรูปใหม่</button>
      <button type="button" class="btn sm subtle" data-action="remove-photo" {{^hasPhoto}}hidden{{/hasPhoto}}>{{icon:close}}ลบรูป</button>
    </div>
  </div>
  <input class="sr-only" type="file" id="photo-file" accept="image/png,image/jpeg" tabindex="-1" aria-hidden="true" data-photo-input="1" data-file-ready="1">
  <input type="hidden" name="avatar" value="{{avatar}}">
</div>
