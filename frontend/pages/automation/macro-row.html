<article class="auto-row">
  <div class="auto-row-main">
    <div class="auto-row-title"><span class="macro-glyph">{{icon:macro}}</span><strong>{{name}}</strong></div>
    <p class="auto-flow"><span>{{steps}}</span></p>
    {{#preview}}<p class="auto-preview">“{{preview}}”</p>{{/preview}}
  </div>
  <div class="auto-row-actions">
    <button class="btn sm" data-action="macro-edit" data-id="{{id}}">{{icon:edit}}แก้ไข</button>
    <button class="icon-btn danger-link" data-action="macro-delete" data-id="{{id}}" aria-label="ลบ Macro {{name}}" title="ลบ Macro">{{icon:trash}}</button>
  </div>
</article>
