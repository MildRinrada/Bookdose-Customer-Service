<article class="card article-card" role="button" tabindex="0" data-action="read-article" data-id="{{id}}" aria-label="อ่านบทความ {{title}}">
  <div class="article-card-top">
    <span class="badge article-category">{{category}}</span>
    {{#isPublic}}<span class="badge resolved" title="แสดงในหน้าช่วยเหลือลูกค้าด้วย">{{visibilityLabel}}</span>{{/isPublic}}
  </div>
  <h3>{{title}}</h3>
  <div class="article-excerpt">{{{excerpt}}}</div>
  <div class="article-card-foot muted">{{icon:clock}}อัปเดต {{updated}}</div>
</article>
